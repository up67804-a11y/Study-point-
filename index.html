<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>EduPro - Modern Study Application</title>
    
    <!-- PWA Settings & Manifest Integration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EduPro">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3429/3429149.png">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Mozilla PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Header Bar with Professional Custom App Logo -->
    <header class="app-header">
        <div class="header-container">
            <!-- Brand Logo & Name -->
            <div class="brand-logo">
                <!-- Custom Gradient App Logo SVG -->
                <svg class="app-logo-svg" viewBox="0 0 100 100" width="42" height="42" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3b82f6"/>
                            <stop offset="50%" stop-color="#8b5cf6"/>
                            <stop offset="100%" stop-color="#06b6d4"/>
                        </linearGradient>
                    </defs>
                    <rect width="100" height="100" rx="24" fill="url(#logoGrad)"/>
                    <path d="M50 25 L80 40 L50 55 L20 40 Z" fill="#ffffff"/>
                    <path d="M28 47.5 V62 C28 62, 38 72, 50 72 C62 72, 72 62, 72 62 V47.5" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
                    <circle cx="80" cy="52" r="3" fill="#ffffff"/>
                    <path d="M80 55 V68" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <h1 class="brand-title">EduPro</h1>
            </div>
        </div>
    </header>

    <main>
        <!-- Selection Controls Bar -->
        <section class="selection-bar">
            <!-- Class Selector -->
            <div class="select-btn" onclick="openModal('classModal')">
                <div class="btn-info">
                    <span class="btn-label">Class Choice</span>
                    <span class="btn-value" id="selectedClassText">Class 12</span>
                </div>
                <i class="fa-solid fa-chevron-down arrow"></i>
            </div>

            <!-- Subject Selector -->
            <div class="select-btn" onclick="openModal('subjectModal')">
                <div class="btn-info">
                    <span class="btn-label">Subject Choice</span>
                    <span class="btn-value" id="selectedSubjectText">Physics</span>
                </div>
                <i class="fa-solid fa-chevron-down arrow"></i>
            </div>

            <!-- Chapter Selector -->
            <div class="select-btn" onclick="openModal('chapterModal')">
                <div class="btn-info">
                    <span class="btn-label">Chapter Choice</span>
                    <span class="btn-value" id="selectedChapterText">All Chapters</span>
                </div>
                <i class="fa-solid fa-chevron-down arrow"></i>
            </div>
        </section>

        <!-- Category Tabs -->
        <section class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('notes', this)">
                <i class="fa-solid fa-book-open"></i> Notes
            </button>
            <button class="tab-btn" onclick="switchTab('papers', this)">
                <i class="fa-solid fa-file-lines"></i> Papers
            </button>
            <button class="tab-btn" onclick="switchTab('others', this)">
                <i class="fa-solid fa-folder-plus"></i> Others
            </button>
        </section>

        <!-- Main Content Area -->
        <section class="content-area">
            <div class="content-header">
                <div class="content-title">
                    <h2 id="contentHeading">Class 12 - Physics : All Chapters PDF</h2>
                    <span class="badge" id="contentTypeBadge">NOTES</span>
                </div>
            </div>

            <!-- Material Items List -->
            <div class="material-list" id="materialList">
                <!-- JavaScript renders items here -->
            </div>
        </section>
    </main>

    <!-- Modal 1: Select Class -->
    <div class="modal-overlay" id="classModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Select Your Class</h3>
                <button class="close-btn" onclick="closeModal('classModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body class-grid" id="classList"></div>
        </div>
    </div>

    <!-- Modal 2: Select Subject -->
    <div class="modal-overlay" id="subjectModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Select Subject</h3>
                <button class="close-btn" onclick="closeModal('subjectModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="subjectList"></div>
        </div>
    </div>

    <!-- Modal 3: Select Chapter -->
    <div class="modal-overlay" id="chapterModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Select Chapter</h3>
                <button class="close-btn" onclick="closeModal('chapterModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="chapterList"></div>
        </div>
    </div>

    <!-- Fullscreen Canvas PDF Viewer Modal -->
    <div class="modal-overlay" id="pdfViewerModal">
        <div class="modal pdf-viewer-modal">
            <div class="modal-header">
                <h3 id="pdfViewerTitle">PDF Viewer</h3>
                <button class="close-btn" onclick="closeModal('pdfViewerModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="pdf-body" id="pdfContainer">
                <div id="pdfLoading" class="pdf-loading">
                    <i class="fa-solid fa-spinner fa-spin"></i> Loading PDF Pages...
                </div>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
